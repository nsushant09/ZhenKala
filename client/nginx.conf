server {
    listen 80;
    
    # The folder where your React build (dist) files are located
    root /usr/share/nginx/html;
    index index.html;

    # 1. Increase upload size for the client side as well
    client_max_body_size 100M;

    # 2. Handle the React Frontend
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/mime.types;
    }

    # 3. Prevent index.html from being cached 
    # This prevents the "MIME type/Failed to fetch" error after new deployments
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 4. Long-term cache for hashed assets (JS/CSS)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 5. API Proxy to the Backend
    location /api/ {
        proxy_pass http://zhenkala-server:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Ensure timeouts match your file upload needs
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
}